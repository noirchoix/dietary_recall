[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dietary-recall-research"
version = "0.5.1"
description = "Governed dietary recall research platform with provenance, licensed ingestion and reproducible analytics"
requires-python = ">=3.10"
dependencies = [
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
dietary-recall = "dietary_recall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
